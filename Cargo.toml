[workspace]
resolver = "2"
members = [
    "packages/appbase",
    # Clients for somebody else's API, and nothing else: each knows one upstream's wire format
    # and cannot name an account, a valuation or a minor unit, because it depends on no other
    # member — not even on its siblings here. Separate so a field rename upstream is a one-line
    # fix in one crate, recompiling no domain logic — the same reasoning that keeps
    # `akahu-client` outside this tree. See each crate's docs.
    "packages/frankfurter-client",
    "packages/house-pricer-client",
    "packages/yahoo-finance-client",
    # Observability, and like `packages/appbase` it depends on nothing else in the workspace
    # — every layer from the DAL up records into it, so anything it depended on could not
    # then be instrumented. Holds the instrument registry, the OTLP/SDK wiring, and the
    # span-duration layer; see docs/OBSERVABILITY.md.
    "packages/telemetry",
    "packages/core",
    "packages/scheduler",
    "packages/dal",
    "packages/providers",
    "packages/app",
    "packages/api",
    # The second driving adapter, sibling to `packages/api`: the same application core
    # reached over MCP instead of HTTP, so an agent can read the ledger (and, under a
    # separate opt-in, write to it). Depends only on `sure-app`, exactly as `sure-api`
    # does, and never names `sure-dal` or a transport of its own — `sure-server` mounts it.
    "packages/mcp",
    "packages/server",
    # Test support, never linked into a release binary: the programmable-proxy cluster that
    # stands in for the third-party hosts `sure-providers` reaches. A workspace member (not a
    # dev-dep-only sidecar) so clippy and `cargo test` cover it like everything else.
    "packages/testproxy",
]

[workspace.package]
version = "0.1.0"
# The rustc floor edition 2024 needs (1.85) is far below the one `sqlx` 0.9 already imposes
# (1.94), so this costs no toolchain support — see the Rust note in the README. rustfmt's
# style edition is pinned separately in rustfmt.toml, so this line moves the language only.
edition = "2024"
# AGPL-3.0-only, not MIT: parts of the web layer are transcribed from we-promise/sure
# (AGPL-3.0), so this is a derivative work and cannot be relicensed more permissively.
# `-only` rather than `-or-later` — upstream ships the bare LICENSE with no "or later"
# grant, and we do not hand on more than we received. See LICENSE and README.
license = "AGPL-3.0-only"
repository = ""

[workspace.lints.rust]
# (no new rustc lints yet — clippy carries this rule)

[workspace.lints.clippy]
# CLAUDE.md rule 2, direct enforcement: a `_` or `variant | _` arm over an enum is a hard
# error. Every legitimate use (an external #[non_exhaustive] enum) needs `#[allow(..)]`
# with a comment, per the CLAUDE.md rule — that's the intended friction.
wildcard_enum_match_arm = "deny"
# Complements the above: catches `Foo::A | _ =>` where naming the one remaining variant
# instead of `_` is just as short.
match_wildcard_for_single_variants = "deny"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros", "http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
    "http1",
    "http2",
] }
tower-http = { version = "0.7", features = [
    "trace",
    "cors",
    "fs",
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "set-header",
    "catch-panic",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
akahu-client = "0.3"
utoipa = { version = "5", features = ["axum_extras", "chrono", "decimal", "preserve_order"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["gzip-http"] }
opentelemetry-semantic-conventions = "0.32"
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
landlock = "0.4"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
csv = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
calamine = { version = "0.36.1", default-features = false, features = ["dates"] }
partly-proxy-lib = { git = "https://github.com/thepartly/partly-proxy", rev = "0d9c7450ea9a9af59acaffd4519c07a1ef8bf08a" }
http = "1"
bytes = "1"
tempfile = "3"
libc = "0.2"
zen-expression = "0.55"
rand = "0.10"
rand_distr = "0.6"
rmcp = { version = "3", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }

sure-appbase = { path = "packages/appbase" }
frankfurter-client = { path = "packages/frankfurter-client" }
house-pricer-client = { path = "packages/house-pricer-client" }
yahoo-finance-client = { path = "packages/yahoo-finance-client" }
sure-telemetry = { path = "packages/telemetry" }
sure-core = { path = "packages/core" }
sure-scheduler = { path = "packages/scheduler" }
sure-dal = { path = "packages/dal" }
sure-providers = { path = "packages/providers" }
sure-app = { path = "packages/app" }
sure-api = { path = "packages/api" }
sure-mcp = { path = "packages/mcp" }
sure-testproxy = { path = "packages/testproxy" }

# Debug info is line tables only, not full DWARF. The `sqlx::query!` and utoipa derive
# expansions make these crates enormous once every local variable is described: measured
# 2026-08-21, `libsure_dal.rlib` was 122 MB, `libsure_api.rlib` 122 MB, and the `sure_api`
# test binary 141 MB — and `target/debug/deps` keeps every configuration it has ever built,
# so 52 retained copies of that one test binary were 7 GB on their own.
#
# Line tables are what a backtrace actually reads, so a panic in a test or a 500 in the dev
# server still names the file and line. What is given up is inspecting local variables in a
# debugger; if you need that, build the one crate you are stepping through with
# `RUSTFLAGS="-C debuginfo=2"`.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
