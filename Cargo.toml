[workspace]
resolver = "2"
members = [
    "packages/appbase",
    "packages/core",
    "packages/scheduler",
    "packages/dal",
    "packages/providers",
    "packages/app",
    "packages/api",
    "packages/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.lints.rust]
# (no new rustc lints yet — clippy carries this rule)
# `tokio_unstable` is not a cargo feature: it is a `--cfg` the *build* sets (see
# scripts/blocked.mjs), and tokio only emits the task spans the blocking detector reads
# when it is present. Declaring it here is what lets `sure-api` say `cfg!(tokio_unstable)`
# without tripping rustc's unexpected-cfg check under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
# CLAUDE.md rule 2, direct enforcement: a `_` or `variant | _` arm over an enum is a hard
# error. Every legitimate use (an external #[non_exhaustive] enum) needs `#[allow(..)]`
# with a comment, per the CLAUDE.md rule — that's the intended friction.
wildcard_enum_match_arm = "deny"
# Complements the above: catches `Foo::A | _ =>` where naming the one remaining variant
# instead of `_` is just as short.
match_wildcard_for_single_variants = "deny"

# Shared dependency versions so the api crate and the e2e test crate stay in lockstep.
[workspace.dependencies]
# `http2` is NOT an axum default feature; without it hyper's auto-detecting connection
# builder never sees the HTTP/2 preface and the server is HTTP/1.1-only. Enabling it gives
# prior-knowledge h2c, which is what a reverse proxy configured to talk HTTP/2 to its
# origin needs. Browsers still only get h2/h3 from whatever terminates TLS in front.
axum = { version = "0.8", features = ["macros", "http2"] }
tokio = { version = "1", features = ["full"] }
# `rt` is what carries `TaskTracker`; `CancellationToken` comes with it. `sure-appbase`
# uses both to make "has everything this process spawned actually stopped?" an exact,
# awaitable question instead of a poll over `RuntimeMetrics::num_alive_tasks`.
tokio-util = { version = "0.7", features = ["rt"] }
# `util` for `ServiceExt::map_request` — the accept loop uses it to adapt hyper's
# `Request<Incoming>` to the `Request<axum::body::Body>` the router wants.
tower = { version = "0.5", features = ["util"] }
# `hyper`/`hyper-util` are named directly by `sure-server`'s accept loop, which replaces
# `axum::serve` so the connection-level abuse guards (header-read timeout, buffer caps, h2
# stream caps, connection ceiling, graceful drain) are actually reachable — `axum::serve`
# builds its hyper `Builder` internally and exposes none of them. See packages/server/src/http.rs.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
    "http1",
    "http2",
] }
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "fs",
    # Response compression. br/gzip/zstd only: deflate is strictly worse than gzip and no
    # client asks for it alone. Request *de*compression is deliberately absent — it has no
    # decompressed-size cap, which would turn the config-import route into a zip-bomb target.
    "compression-br",
    "compression-gzip",
    "compression-zstd",
    "set-header",
    "catch-panic",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "macros",
    "migrate",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# NOTE: SQLite has no native NUMERIC type, so decimals (fx rates, share prices) are
# persisted as TEXT and parsed into `Decimal` in Rust — sqlx's decimal feature targets
# Postgres/MySQL and is intentionally not wired into the SQLite pool.
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
# rustls (not the default native-tls/OpenSSL backend) so cross-compiling the release
# binary doesn't need OpenSSL headers; the runtime image installs ca-certificates for it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "decimal", "preserve_order"] }
thiserror = "2"
anyhow = "1"
# Local-run convenience only: the server loads a `.env` so `pnpm dev` / `cargo run` pick up
# provider tokens without the caller exporting them. Real env vars always win — see
# `sure_server::config::load_dotenv`.
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Development only, behind `sure-api`'s `blocking-detector` feature: a tracing layer that
# times every tokio task poll and warns when one runs long enough to have blocked its
# worker thread. Never enabled by a normal build — see the README's "Finding blocking code".
tokio-blocked = "0.1"
# Linux-only, and only depended on by `sure-server`: the self-sandbox it applies in `main`
# before the tokio runtime starts. See packages/server/src/sandbox.rs.
landlock = "0.4"
# Only used to name sqlx's `log_statements` level filter; sqlx's logging itself is
# bridged into `tracing` by the subscriber.
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
csv = "1"
zen-expression = "0.55"
# The forecast's Monte Carlo simulation: a seedable RNG (reproducible in tests) plus the
# normal distribution its stochastic accounts/categories draw monthly returns from.
rand = "0.8"
rand_distr = "0.4"

# Internal crates
sure-appbase = { path = "packages/appbase" }
sure-core = { path = "packages/core" }
sure-scheduler = { path = "packages/scheduler" }
sure-dal = { path = "packages/dal" }
sure-providers = { path = "packages/providers" }
sure-app = { path = "packages/app" }
sure-api = { path = "packages/api" }

# `akahu-client` 0.3 is not on crates.io yet. It is the user's own crate, developed in a
# sibling checkout and published by hand, and 0.3 is the release that stops one unrecognised
# Akahu enum value (a transaction `type`, an account `type`/`status`) from failing the whole
# 100-item page it arrived in — which, because a sync cursor only advances on success, wedged
# that account's import permanently rather than for one poll. `sure-providers` needs that
# behaviour now, so the version requirement stays `"0.3"` (a real requirement, satisfiable
# from the registry the moment it is published) and this patch is what resolves it in the
# meantime.
#
# DO NOT DELETE until 0.3.0 is on crates.io: without it `cargo` cannot resolve `"0.3"` at all
# and the whole workspace fails to build. Once published, deleting these two lines is the
# entire change — no manifest in `packages/` mentions the path.
[patch.crates-io]
akahu-client = { path = "../akahu-client" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
