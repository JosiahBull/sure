# Dependabot opens dependency-update PRs on a schedule. Those PRs run CI (the reusable
# checks suite); the dependabot-auto-merge workflow turns on GitHub auto-merge so a bump
# lands only once CI is green (requires branch protection with the checks as required).
version: 2
updates:
  # Rust crates across the whole Cargo workspace (Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Bundle low-risk bumps into one PR to cut noise.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # Majors are never auto-merged: on 2026-08-11 sqlx 0.8→0.9, tower-http 0.6→0.7 and
    # zip 2.4→8.6 landed on main 12s, 25s and 3m after being opened, because auto-merge
    # with no required checks merges immediately. Bump majors by hand, with the migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node/pnpm packages across the pnpm workspace (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # As above: majors are a human decision, not an automatic one.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # openapi-fetch 0.17.0 specifically, which cannot be taken: it wraps `data` and `error`
      # in openapi-typescript-helpers' `Readable<T>`, whose array branch collapses tuples, so
      # `StoredTaxScale.brackets` — generated from Rust's `Vec<(Option<i64>, i64)>` as
      # `[number | null, number][]` — degrades to `(number | null)[][]` and fails
      # `pnpm --filter @sure/web check` in src/pages/TaxRates.svelte. Re-verified against the
      # real package on 2026-08-16 (PR #9), not taken on trust from the note in
      # packages/client/package.json, which is where the full reasoning lives.
      #
      # Pinned to the one broken release rather than `0.17.x` or a blanket minor ignore, so a
      # fixed 0.17.1 or 0.18 is still proposed the week it appears — the upstream fixes
      # (openapi-ts/openapi-typescript#2673, #2842) are open but unmerged, and 0.17.0 is
      # currently the only 0.17.x. Drop this entry, and the cap in packages/client and
      # packages/api-tests, together once one lands.
      - dependency-name: "openapi-fetch"
        versions: ["0.17.0"]

  # The GitHub Actions used by the CI, release, and snapshot workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
