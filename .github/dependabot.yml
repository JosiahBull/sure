# Dependabot opens dependency-update PRs on a schedule. Those PRs run CI (the reusable
# checks suite); the dependabot-auto-merge workflow turns on GitHub auto-merge so a bump
# lands only once CI is green (requires branch protection with the checks as required).
#
# Unattended merging is only as safe as the classification it trusts, and Dependabot's has
# one hole this repository has already fallen into twice: while a dependency's major is 0 it
# calls 0.8 -> 0.9 a *minor*, but that is the compatibility boundary in both Cargo's and
# npm's semver, so the bump is breaking. Hence the long per-name `ignore:` lists below —
# every 0.x direct dependency is withheld from minor bumps and taken by hand, exactly like
# a major. `scripts/check-dependabot.sh` (the `Dependabot config` job in checks.yml) is
# what keeps those lists honest: add a 0.x dependency without listing it and CI fails,
# printing the lines to paste. Patch bumps still flow for everything, which is the point.
version: 2
updates:
  # Rust crates across the whole Cargo workspace (Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Bundle low-risk bumps into one PR to cut noise.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # Majors are never auto-merged: on 2026-08-11 sqlx 0.8→0.9, tower-http 0.6→0.7 and
    # zip 2.4→8.6 landed on main 12s, 25s and 3m after being opened, because auto-merge
    # with no required checks merges immediately. Bump majors by hand, with the migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The OpenTelemetry family, added with `packages/telemetry`. They move as a set — an
      # `opentelemetry_sdk` minor is matched by `opentelemetry-otlp` and `tracing-opentelemetry`
      # in the same week — so taking one alone does not build, which is a second reason beyond
      # the 0.x rule for these never being an unattended merge.
      - dependency-name: "opentelemetry"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "opentelemetry-appender-tracing"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "opentelemetry-otlp"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "opentelemetry-semantic-conventions"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "opentelemetry_sdk"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tracing-opentelemetry"
        update-types: ["version-update:semver-minor"]

      # Every 0.x direct crate, withheld from *minor* bumps for the reason in the header:
      # `axum = "0.8"` does not resolve 0.9, so 0.8 -> 0.9 is a rewrite of the requirement
      # and a breaking change, however Dependabot labels it.
      #
      # Note what that means for the wildcard above: two of the three bumps its comment
      # cites were not majors at all. Dependabot stamped both bbc6ba9 (sqlx 0.8.6 -> 0.9.0)
      # and cfb6491 (tower-http 0.6.11 -> 0.7.0) `update-type: version-update:semver-minor`
      # in their own commit trailers, so the wildcard would have let them through a second
      # time — only zip 2.4 -> 8.6 was ever caught by it. This list is what actually closes
      # that case, which is why it has to be enforced rather than merely written down.
      #
      # Cargo has no shorthand for it and Dependabot no setting, so it is a list — kept
      # current by scripts/check-dependabot.sh, which reads the requirement out of every
      # dependency table in Cargo.toml and packages/*/Cargo.toml and fails CI on anything
      # missing. Alphabetical, matching the order that script prints.
      - dependency-name: "akahu-client"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "async-trait"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "axum"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "calamine"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "chrono"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "dotenvy"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "futures-util"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "hyper-util"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "landlock"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "libc"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "log"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "rand_distr"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sqlx"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tokio-util"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tower"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tower-http"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tracing"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tracing-subscriber"
        update-types: ["version-update:semver-minor"]

  # Node/pnpm packages across the pnpm workspace (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # As above: majors are a human decision, not an automatic one.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # Every 0.x direct package, withheld from minor bumps — the same rule as the cargo
      # block, and for the same reason: `^0.16.0` caps below 0.17.0 exactly as Cargo's
      # `0.3` caps below 0.4. scripts/check-dependabot.sh reads `dependencies` and
      # `devDependencies` out of package.json and packages/*/package.json and fails CI on
      # anything missing here. devDependencies are in scope deliberately: openapi-typescript
      # generates the client every typecheck consumes, and @playwright/test decides whether
      # the committed baselines are even comparable.
      #
      # openapi-fetch is why this rule exists rather than being a precaution. 0.17.0 wraps
      # `data` and `error` in openapi-typescript-helpers' `Readable<T>`, whose array branch
      # collapses tuples, so `StoredTaxScale.brackets` — generated from Rust's
      # `Vec<(Option<i64>, i64)>` as `[number | null, number][]` — degrades to
      # `(number | null)[][]` and fails `pnpm --filter @sure/web check` in
      # src/pages/TaxRates.svelte. Verified against the real package on 2026-08-11 and again
      # on 2026-08-16 (PR #9, closed).
      #
      # Both caps were raised to 0.17 by hand on 2026-10-30. The regression is still open
      # upstream (openapi-ts/openapi-typescript#2673, #2842), but `StoredTaxScale` went in
      # 2e73f09 and no response type carries a tuple any more, so nothing in the tree hits
      # it. packages/client/package.json holds the caveat for the next tuple. The entry below
      # stays because openapi-fetch is still 0.x: an 0.18 is the next break of this kind.
      - dependency-name: "@types/d3-sankey"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "d3-sankey"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "openapi-fetch"
        update-types: ["version-update:semver-minor"]

  # The GitHub Actions used by the CI, release, and snapshot workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # The two builder images in packages/api/Dockerfile, which pins each by exact tag in its FROM
  # line (the only place this updater reads one). The major ignore holds node on the 24 LTS line
  # that `engines.node` and CI's node-version name. The rust tag does not choose the compiler —
  # rust-toolchain.toml, the next entry, does — so a bump of either alone builds with the right
  # rustc; the tag only spares the build a download when the two agree.
  - package-ecosystem: docker
    directory: "/packages/api"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # rust-toolchain.toml: the Rust that CI, the pre-commit hook and the release image all compile
  # with. A bump arrives as a PR that runs every gate on the new compiler, new clippy lints included,
  # so auto-merge takes it only once all of them pass.
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
