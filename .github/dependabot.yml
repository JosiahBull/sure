# Dependabot opens dependency-update PRs on a schedule. Those PRs run CI (the reusable
# checks suite); the dependabot-auto-merge workflow turns on GitHub auto-merge so a bump
# lands only once CI is green (requires branch protection with the checks as required).
version: 2
updates:
  # Rust crates across the whole Cargo workspace (Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Bundle low-risk bumps into one PR to cut noise.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # Majors are never auto-merged: on 2026-08-11 sqlx 0.8→0.9, tower-http 0.6→0.7 and
    # zip 2.4→8.6 landed on main 12s, 25s and 3m after being opened, because auto-merge
    # with no required checks merges immediately. Bump majors by hand, with the migration.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Node/pnpm packages across the pnpm workspace (pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # As above: majors are a human decision, not an automatic one.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The GitHub Actions used by the CI, release, and snapshot workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
