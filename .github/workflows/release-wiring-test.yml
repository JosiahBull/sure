name: Release verify wiring test (temporary)

# TEMPORARY, deleted before this branch merges. Two things release.yml's `verify` change
# cannot show in a PR's CI:
#   1. scripts/main-ci-result.sh, run under the job token release.yml gives it
#      (actions: read, contents: read), against real runs of ci.yml on main.
#   2. The needs/if wiring around the conditional `checks` job, replayed with stub jobs in
#      the four shapes a release can take. Job names say what each scenario expects.

on:
  push:
    branches:
      - ci/release-reuse-main-ci

permissions:
  contents: read

jobs:
  lookup:
    name: lookup ${{ matrix.case }} (expect ${{ matrix.expect }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: success-e4d90be
            sha: e4d90beee0c5965abc088a6a10e7fa741702629c
            expect: reuse
          - case: cancelled-38047ed
            sha: 38047edb978f94eb43860a28097aa05bfed3f7dd
            expect: run
          - case: no-run-dependabot-a4f807b
            sha: a4f807b6ea86d4c7a08714432b24948a14b9706b
            expect: run
          - case: failure-bde417f
            sha: bde417fc95b2aa537280f90995b62b48260f3a6f
            expect: exit-1
    steps:
      - uses: actions/checkout@v7
      - name: Run the lookup and compare
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ matrix.sha }}
          EXPECT: ${{ matrix.expect }}
          MAIN_CI_APPEAR_SECS: "0"
        run: |
          set +e
          got=$(./scripts/main-ci-result.sh "$SHA")
          code=$?
          set -e
          [ "$code" -eq 0 ] || got="exit-${code}"
          echo "expected ${EXPECT}, got ${got}"
          [ "$got" = "$EXPECT" ]

  # The verify job's ancestry step relies on `fetch-depth: 0` giving it origin/main.
  ancestry:
    name: ancestry check against origin/main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          git rev-parse --verify origin/main
          git merge-base --is-ancestor e4d90beee0c5965abc088a6a10e7fa741702629c origin/main
          echo "e4d90be is on origin/main"
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::this branch's HEAD should not be on main"; exit 1
          fi
          echo "HEAD ($(git rev-parse --short HEAD)) is correctly reported as not on main"

  # --- wiring: one copy of the release graph per scenario, with stub jobs -------------

  verify_reuse:
    name: "reuse: verify"
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
    steps:
      - id: ci
        run: echo "checks=reuse" >> "$GITHUB_OUTPUT"
  checks_reuse:
    name: "reuse: checks (expect skipped)"
    needs: [verify_reuse]
    if: needs.verify_reuse.outputs.checks == 'run'
    uses: ./.github/workflows/release-wiring-stub.yml
    with:
      pass: true
  image_reuse:
    name: "reuse: image (expect ran)"
    needs: [verify_reuse, checks_reuse]
    if: >-
      !cancelled()
      && needs.verify_reuse.result == 'success'
      && (needs.checks_reuse.result == 'success' || needs.checks_reuse.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "checks result was ${{ needs.checks_reuse.result }}"
  merge_reuse:
    name: "reuse: merge (expect ran)"
    needs: [image_reuse]
    if: ${{ !cancelled() && needs.image_reuse.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  merge_default_reuse:
    name: "reuse: merge with default if (probe)"
    needs: [image_reuse]
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  verify_runpass:
    name: "run-pass: verify"
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
    steps:
      - id: ci
        run: echo "checks=run" >> "$GITHUB_OUTPUT"
  checks_runpass:
    name: "run-pass: checks (expect ran, pass)"
    needs: [verify_runpass]
    if: needs.verify_runpass.outputs.checks == 'run'
    uses: ./.github/workflows/release-wiring-stub.yml
    with:
      pass: true
  image_runpass:
    name: "run-pass: image (expect ran)"
    needs: [verify_runpass, checks_runpass]
    if: >-
      !cancelled()
      && needs.verify_runpass.result == 'success'
      && (needs.checks_runpass.result == 'success' || needs.checks_runpass.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "checks result was ${{ needs.checks_runpass.result }}"
  merge_runpass:
    name: "run-pass: merge (expect ran)"
    needs: [image_runpass]
    if: ${{ !cancelled() && needs.image_runpass.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  verify_runfail:
    name: "run-fail: verify"
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
    steps:
      - id: ci
        run: echo "checks=run" >> "$GITHUB_OUTPUT"
  checks_runfail:
    name: "run-fail: checks (expect ran, fail)"
    needs: [verify_runfail]
    if: needs.verify_runfail.outputs.checks == 'run'
    uses: ./.github/workflows/release-wiring-stub.yml
    with:
      pass: false
  image_runfail:
    name: "run-fail: image (expect skipped)"
    needs: [verify_runfail, checks_runfail]
    if: >-
      !cancelled()
      && needs.verify_runfail.result == 'success'
      && (needs.checks_runfail.result == 'success' || needs.checks_runfail.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: "true"
  merge_runfail:
    name: "run-fail: merge (expect skipped)"
    needs: [image_runfail]
    if: ${{ !cancelled() && needs.image_runfail.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  verify_fail:
    name: "verify-fail: verify (fails)"
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
    steps:
      - id: ci
        run: |
          echo "checks=run" >> "$GITHUB_OUTPUT"
          exit 1
  checks_vfail:
    name: "verify-fail: checks (expect skipped)"
    needs: [verify_fail]
    if: needs.verify_fail.outputs.checks == 'run'
    uses: ./.github/workflows/release-wiring-stub.yml
    with:
      pass: true
  image_vfail:
    name: "verify-fail: image (expect skipped)"
    needs: [verify_fail, checks_vfail]
    if: >-
      !cancelled()
      && needs.verify_fail.result == 'success'
      && (needs.checks_vfail.result == 'success' || needs.checks_vfail.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: "true"
