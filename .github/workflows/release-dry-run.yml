name: Release dry run (temporary)

# TEMPORARY, deleted before this branch merges. Runs release.yml's `meta` and per-arch
# `image` jobs on both runners with push=false, no registry login, read-only permissions
# and no layer cache (a cold build, like a fresh tag), so the native compile times can be
# measured without publishing anything. The `merge` stand-in only checks that both digests
# arrive and prints the command the real job would run.

on:
  push:
    branches:
      - ci/release-native-runners

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io

jobs:
  meta:
    name: Image metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

  image:
    name: Build image, no push (${{ matrix.arch }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.meta.outputs.image }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: ${DIGEST}"
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: Merge stand-in (prints only)
    needs: [meta, image]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.meta.outputs.image }}
      TAGS: ${{ needs.meta.outputs.tags }}
      LABELS: ${{ needs.meta.outputs.labels }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Print what the merge would run
        working-directory: ${{ runner.temp }}/digests
        run: |
          printf 'labels:\n%s\n' "$LABELS"
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64, arm64), got ${#sources[@]}: ${sources[*]}"
            exit 1
          fi
          echo "would run: docker buildx imagetools create ${tags[*]} ${sources[*]}"
