name: Release

# Cut a release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must name a commit on main, match the version declared in Cargo.toml /
# package.json, and main's CI must have passed on that commit (the `verify` job).
#
# The image is built one architecture per job, each on a runner of that architecture, then
# joined into one multi-arch tag:
#
#   verify [-> checks, only when main has no result] -> image (amd64), image (arm64)
#     -> merge -> github-release     (meta runs alongside verify; image needs it too)
#
# That is Docker's "distribute build across multiple runners" recipe, written out by hand.
# Docker now packages it as the docker/github-builder reusable workflow, which also signs and
# attests what it pushes with an OIDC token; adopting that changes what is published, so it
# is its own decision. arm64 used to be built under QEMU on the amd64 runner, where its
# `cargo build --release` took 5,493 s against 643 s for amd64 (v0.7.0's log); natively it
# took 254 s.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io

jobs:
  # Nothing is published unless this passes. It does not run the merge gates again: ci.yml
  # ran checks.yml on this exact commit when it landed on main, and that result is reused.
  # Running the suite a second time on the tag cost about 8 minutes, and v0.7.0's tag run
  # failed on a flaky test the same commit had passed on its PR and on main. There is
  # still no release-only copy of any check.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    # main-ci-result.sh waits up to 2 minutes for main's run to appear and 30 for it to
    # finish; this bounds the job if the API hangs.
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      checks: ${{ steps.ci.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the ancestry check needs main's history

      # On a tag, also asserts the tag (vX.Y.Z) matches the declared version.
      - name: Tag matches the declared version
        run: ./scripts/check-versions.sh

      # Main is where the reused result comes from, so a tag anywhere else has none.
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} names $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # Prints `reuse` (a run on main passed) or `run` (no run, or only cancelled ones),
      # and fails when main's run failed or did not finish in time. See the script header.
      - name: Main's CI result for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/main-ci-result.sh "$(git rev-parse HEAD)"

  # The fallback, for a commit main has no result for. ci.yml cancels a superseded run on
  # main as well as on a PR, so two merges close together leave the first without one, and
  # a merge GitHub makes for Dependabot triggers no workflow at all. The identical suite
  # then runs here, on the tag, as it used to for every release.
  checks:
    needs: [verify]
    if: needs.verify.outputs.checks == 'run'
    uses: ./.github/workflows/checks.yml

  # The image name, tags and OCI labels, computed once: both architectures then carry
  # identical labels, and the merge job tags exactly what the builds were labelled as.
  meta:
    name: Image metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # GHCR rejects upper case, and `github.repository` keeps the owner's (JosiahBull).
      # metadata-action lowercases the tags it emits, but the by-digest push and the merge
      # name the bare repository as well, so it is lowercased here for all three.
      - id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ghcr.io/<owner>/<repo>, tagged 0.1.0, 0.1, and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

  # One job per architecture, each on a runner of that architecture, so nothing is
  # emulated. Each pushes an untagged image by digest and hands the digest to `merge`, so
  # no tag can point at a release with only one architecture built.
  image:
    name: Build and push image (${{ matrix.arch }})
    needs: [verify, checks, meta]
    # `checks` is skipped whenever main's result is reused, and by default a skipped need
    # skips this job too. So: verify passed, and checks either passed or was not needed.
    if: >-
      !cancelled()
      && needs.verify.result == 'success'
      && needs.meta.result == 'success'
      && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    strategy:
      # Let the other architecture finish when one fails, so "Re-run failed jobs" rebuilds
      # only the one that broke.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache gets a scope per architecture; sharing the default one, the two
      # jobs would overwrite each other's entry. A tag's run can read only caches written
      # on that tag or on main, and nothing on main writes these, so the export (minutes
      # per job) pays off only when this same tag's run is re-run.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: ${{ needs.meta.outputs.image }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      # `overwrite` so a re-run replaces this architecture's digest rather than failing on
      # the name the first attempt already uploaded.
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Joins the per-architecture digests into one manifest list and tags it X.Y.Z, X.Y and
  # latest. The only job that tags anything, and it runs only once both builds pushed.
  merge:
    name: Publish multi-arch image
    needs: [meta, image]
    # Spelled out because the implicit success() covers every job upstream, not just
    # `needs`: with `checks` skipped, it would skip this job even after both builds passed.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.meta.outputs.image }}
      TAGS: ${{ needs.meta.outputs.tags }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64, arm64), got ${#sources[@]}: ${sources[*]}"
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')
          for want in linux/amd64 linux/arm64; do
            case " $platforms " in
              *" $want "*) ;;
              *) echo "::error::${IMAGE}:${VERSION} has no ${want} image (has: ${platforms})"; exit 1 ;;
            esac
          done

  # Sequenced after the image push so the release page never advertises a tag whose
  # image failed to build. Notes are auto-generated from commits since the previous tag.
  github-release:
    name: Create GitHub release
    needs: [meta, merge]
    # Explicit for the same reason as `merge`.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes walks back to the previous release tag

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.meta.outputs.image }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
          # Append a pointer to the published image beneath the auto-generated notes.
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo "Container image: \`${IMAGE}:${GITHUB_REF_NAME#v}\` (also tagged \`latest\`)."
          } >> notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md