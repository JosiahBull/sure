name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch). On main this
# also cancels an earlier merge's run when another lands behind it, leaving that commit with
# no result; release.yml runs the checks itself when it is asked to release such a commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All merge gates live in the reusable checks workflow (.github/workflows/checks.yml).
  # release.yml reuses this workflow's result on main for the commit it releases, looking it
  # up by this file's name, and calls checks.yml itself only when there is no result.
  checks:
    uses: ./.github/workflows/checks.yml
