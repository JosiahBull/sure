name: Checks

# Reusable suite of merge gates. Called by ci.yml (on push/PR) and by release.yml (on
# tag push) so a release runs — and depends on — the exact same checks as a PR, with no
# duplicated logic between the two workflows. On a tag, the `versions` gate additionally
# asserts the tag matches the declared version (see scripts/check-versions.sh).
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Skip corepack's interactive "download pnpm?" prompt in non-TTY CI.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  # CLAUDE.md rule 3, and the Akahu-recording guard described in docs/TESTING.md. The
  # pre-commit hook runs this first because it is the cheapest gate and the only one guarding
  # something a later gate cannot undo — but a hook is bypassable (`--no-verify`) and per-clone
  # (`core.hooksPath` is set by the `prepare` script), so the gate that matters is this one.
  # `--all` sweeps every tracked file rather than the staged diff a hook sees, which is what a
  # PR needs: the additions may have landed in an earlier commit on the branch.
  #
  # No toolchain, no `pnpm install` — plain node over `git ls-files`, so nothing to cache.
  # `data/sure.db` is a developer's machine only, so provenance cannot be checked here and the
  # script says so per finding; the shape patterns and the Akahu path/content refusal do not
  # need it and are what this job is for.
  pii-scan:
    name: Personal-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/pii-scan.mjs --all

  # Every query in `sure-dal` is compile-time checked against the committed `.sqlx/` metadata
  # (`.cargo/config.toml` pins `SQLX_OFFLINE=true`, so no build anywhere consults a live
  # database). A *missing* entry already fails clippy and the test job, because the build cannot
  # resolve the macro at all. What only this job catches is metadata that no longer agrees with
  # `packages/dal/migrations`: someone regenerating `.sqlx/` against a drifted local database, or
  # editing a query without re-running `pnpm sqlx:prepare`, or a new migration that changes a
  # column a cached query still describes the old way.
  #
  # The script builds a throwaway database under `target/` and applies the migrations to it, so
  # the schema checked against is exactly the one the app and both e2e suites run — never a
  # developer's `data/sure.db` (CLAUDE.md's convention; the script never even names it).
  sqlx:
    name: sqlx offline metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Resolves a prebuilt `sqlx` binary where one is published and only falls back to building
      # it, rather than `cargo install sqlx-cli` always paying that build. Keep the version in
      # step with the `sqlx` crate in Cargo.toml: the CLI writes the `.sqlx/` format the macros
      # read, and a mismatch shows up as "metadata is out of date" for no visible reason.
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - run: node scripts/sqlx-prepare.mjs --check

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The Rust `#[cfg(test)]` modules, packages/appbase/tests, and the doctests — nothing else
  # in this workflow runs them, so without this job they compile under clippy and never
  # execute. `--all-features` matches the clippy line above so feature-gated tests are built
  # at all: sure-api's `blocking_detector_tests` exist only under `blocking-detector`. That
  # feature also wants `RUSTFLAGS="--cfg tokio_unstable"` to observe anything, deliberately
  # not set here — those tests check `cfg!(tokio_unstable)` and skip themselves instead of
  # failing. No `--all-targets`: for `cargo test` it *excludes* doctests rather than adding
  # to them, which would silently drop the sure_appbase usage example.
  test:
    name: Cargo tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # svelte-check (web) + tsc (api-tests). Both consume the generated client, so the
  # OpenAPI spec + typed client are produced first (`pnpm gen:client`, which builds and
  # runs the gen-openapi binary).
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:client
      - run: pnpm --filter @sure/web check
      - run: pnpm --filter @sure/api-tests check

  # Backend e2e suite: Playwright drives the real compiled backend over HTTP (no browser).
  # global-setup builds both binaries it needs — `sure-api` and `sure-testproxy` — so there is
  # no cargo step here; each test spawns its own isolated backend, and each worker one proxy.
  # Nothing in the suite needs network access or extra environment: the proxy binds ephemeral
  # loopback ports and hands the harness the endpoint map *and* the `SURE_SANDBOX_CONNECT_PORTS`
  # that Landlock needs to let the backend reach it (see docs/TESTING.md — a missing one is
  # green locally and red only here).
  api-tests:
    name: API e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:client
      - run: pnpm test:api
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-tests-results
          path: packages/api-tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Frontend visual suite: builds the SPA, boots the real backend serving it behind a
  # `sure-testproxy` (so a click that makes the backend dial a third party cannot leave the
  # container), seeds demo data, and screenshot-compares every page. Its global-setup builds
  # `sure-api` and `sure-testproxy` in one cargo invocation, which is why the only step here is
  # `pnpm test:web` — but the Rust toolchain install below is what makes that possible, since
  # the Playwright image ships neither cargo nor a C toolchain.
  #
  # Runs INSIDE the pinned Playwright image so the Chromium build + font stack exactly match
  # the committed *-linux.png baselines — keep the image tag in lockstep with @playwright/test
  # (regenerate via snapshots.yml).
  web-tests:
    name: Web visual tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v7
      # The container runs as root against a workspace git created; declare it safe so
      # any git calls (and tooling that shells out to git) don't bail on ownership.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The Playwright image has Node + browsers but no Rust/C toolchain.
      - name: Install Rust + C toolchain
        run: |
          apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:client
      - run: pnpm test:web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Cargo.toml and package.json must declare the same version; on a tag it must match.
  # Pure text parsing, so no toolchain/runner setup needed.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-versions.sh
