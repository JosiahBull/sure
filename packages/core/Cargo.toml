[package]
name = "sure-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
utoipa = { workspace = true }
# Persistence concerns are gated so layers that don't talk to the database (the API
# crate, providers) don't pull in sqlx: only the DAL enables this feature. It supplies
# the `AppError: From<sqlx::Error>` conversion and the `sqlx::Type` mapping for enums.
sqlx = { workspace = true, optional = true }
# HTTP concerns (the error's IntoResponse) are gated so non-web crates that depend on
# sure-core (e.g. the DAL) don't pull in the web stack.
axum = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
sqlx = ["dep:sqlx"]
axum = ["dep:axum", "dep:tracing"]
