[package]
name = "sure-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "sure-api"
path = "src/main.rs"

[features]
# Development only: build the binary with `sure-api`'s tokio blocking detector compiled in.
# Needs `RUSTFLAGS="--cfg tokio_unstable"` on the same build to do anything —
# `pnpm dev:api:blocked` / `pnpm test:api:blocked` set both. See the README.
blocking-detector = ["sure-api/blocking-detector"]

[dependencies]
sure-app = { workspace = true }
sure-dal = { workspace = true }
sure-providers = { workspace = true }
sure-scheduler = { workspace = true }
sure-api = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }

# Landlock is a Linux LSM with no equivalent elsewhere; `sandbox.rs` compiles to a logged
# no-op on other platforms so a macOS `cargo run` doesn't need it at all.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
