[package]
name = "sure-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "sure-api"
path = "src/main.rs"

[dependencies]
sure-appbase = { workspace = true }
# `AccountClass`, so the sampler's per-class gauge enumerates the same four classes the domain
# defines rather than a list of strings copied out of `AccountClass::as_str`.
sure-core = { workspace = true }
sure-app = { workspace = true }
sure-dal = { workspace = true }
sure-providers = { workspace = true }
sure-scheduler = { workspace = true }
sure-api = { workspace = true }
# `otel::init` — built in `main`, between the sandbox and the runtime. See the comment there
# for why that is the only place it can go.
sure-telemetry = { workspace = true }
sure-mcp = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio = { workspace = true }
# Only for the container's `--health-check` mode. Adds nothing to the image: every provider
# adapter in `sure-providers` already pulls this in, so the client is linked into the binary
# either way — this line just lets `sure-server` name it.
reqwest = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
# The sampler's clock arithmetic: "how long ago did this provider last sync?" is a
# `DateTime<Utc>` subtraction, and the stored value is an RFC-3339 string.
chrono = { workspace = true }
tracing = { workspace = true }

# Landlock is a Linux LSM with no equivalent elsewhere; `sandbox.rs` compiles to a logged
# no-op on other platforms so a macOS `cargo run` doesn't need it at all.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
