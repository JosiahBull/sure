[package]
name = "sure-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "sure-api"
path = "src/main.rs"

[dependencies]
sure-app = { workspace = true }
sure-dal = { workspace = true }
sure-providers = { workspace = true }
sure-scheduler = { workspace = true }
sure-api = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }

# Landlock is a Linux LSM with no equivalent elsewhere; `sandbox.rs` compiles to a logged
# no-op on other platforms so a macOS `cargo run` doesn't need it at all.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
