[package]
name = "sure-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "sure_api"
path = "src/lib.rs"

[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"

[features]
# Development only. Adds `tokio-blocked`'s layer to the subscriber `init_tracing` installs,
# so a tokio task that spends too long inside one poll — synchronous I/O or CPU-heavy work
# in an async fn — logs a WARN naming the `spawn` callsite. `tokio/tracing` is what makes
# tokio emit the per-task spans it measures; that also needs `--cfg tokio_unstable` at
# build time, which the feature cannot express (see `telemetry::blocking`). Off in every
# normal build: the layer forces span bookkeeping the release binary should not pay for.
blocking-detector = ["dep:tokio-blocked", "tokio/tracing"]

[dependencies]
sure-core = { workspace = true, features = ["axum"] }
sure-app = { workspace = true }
sure-providers = { workspace = true }
# For the `Shutdown` handle on `AppState`: a handler that starts work outliving its
# response (the post-import valuation backfill) must spawn it on the tracker, or the
# shutdown report cannot see it and cheerfully claims `clean=true` while it is cut off
# mid-write. `sure-appbase` depends on nothing else in the workspace, so this is a leaf.
sure-appbase = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-blocked = { workspace = true, optional = true }
uuid = { workspace = true }
