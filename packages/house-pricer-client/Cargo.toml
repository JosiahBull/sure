[package]
name = "house-pricer-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Deliberately depends on nothing in this workspace. It is a client for somebody else's API,
# not a part of Sure: it knows the wire format and nothing about accounts, valuations or minor
# units. That is the whole point of the split — see the crate docs.
[dependencies]
# Only for the HTTP-date form of `Retry-After` — RFC 9110 allows it alongside delay-seconds, and
# chrono's RFC 2822 reader accepts IMF-fixdate, so honouring it costs a dependency the other two
# client crates already carry rather than a hand-rolled date parser.
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
