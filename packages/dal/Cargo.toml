[package]
name = "sure-dal"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The DAL is the only layer that talks to the database, so it enables sure-core's
# sqlx integration (the `From<sqlx::Error>` conversion + enum `Type` mapping, and
# `FromRow` on sure-core's request/response structs).
sure-core = { workspace = true, features = ["sqlx"] }
# Implements the generic scheduler's storage port (`TaskStateStore`) against SQLite —
# the DAL is the only crate that talks to the database.
sure-scheduler = { workspace = true }
# Implements sure-app's repo ports (`SqliteStore`) against SQLite — the SQL itself stays
# in this crate's existing per-entity modules; `store.rs` only maps row shapes.
sure-app = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
log = { workspace = true }
# `tokio::time::sleep` for `with_busy_retry`'s backoff — a retry has to yield the worker
# thread rather than block it (the blocking detector would rightly complain otherwise).
# Also carries `#[tokio::test]` for this crate's tests, which is why there is no separate
# dev-dependency on it.
tokio = { workspace = true }
